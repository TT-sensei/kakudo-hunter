<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ナビアン図鑑 - ANGLE HUNTER</title>
<style>
:root{--bg:#eef3f7;--navy:#17233b;--muted:#667085;--line:#d9e1ea;--gold:#e3a400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--navy);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
body{overflow:auto}.book-shell{width:min(1120px,100%);margin:auto;padding:18px}
.book-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.book-head h1{margin:0;font-size:clamp(1.4rem,4vw,2rem)}.book-head p{margin:4px 0 0;color:var(--muted);font-size:.78rem}.book-head p b{color:var(--navy)}
.head-btn{min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer}
.book-group-title{margin:22px 0 10px;font-size:1.05rem}.book-group-title:first-child{margin-top:0}
.book-group-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.book-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:8px;text-align:center;box-shadow:0 3px 10px rgba(24,42,67,.06)}
.book-card img{display:block;width:100%;height:125px;object-fit:contain}.book-card span{display:block;font-size:.72rem;font-weight:800;line-height:1.35}.book-card small{display:block;margin-top:4px;color:var(--muted);font-size:.62rem;font-weight:800}
.book-card.locked img{filter:brightness(0);opacity:.82}.book-card.locked span{color:#7b8492}
@media(max-width:900px){.book-group-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){.book-shell{padding:14px}.book-group-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.book-card{padding:7px;border-radius:13px}.book-card img{height:105px}.book-card span{font-size:.64rem}}
</style>
</head>
<body>
<main class="book-shell">
<header class="book-head"><div><h1>ナビアン図鑑</h1><p>発見したモンスター <b id="bookProgress">0 / 0 種</b></p></div><button class="head-btn" id="bookBack">タイトルへ</button></header>
<section id="bookGrid" aria-label="ナビアン図鑑"></section>
</main>
<script src="js/monsters.js"></script>
<script>
const gets2=read('angleHunter.navianGets.v2'),grid=document.getElementById('bookGrid');
let discovered=0;
for(const level of [1,2,3]){
 const title=document.createElement('h2');title.className='book-group-title';title.textContent=level===1?'レベル1　ナビアン':level===2?'レベル2　エボナビ':'レベル3　ボスナビ';grid.appendChild(title);
 const wrap=document.createElement('div');wrap.className='book-group-grid';
 MONSTERS.filter(m=>m.level===level).forEach(m=>{
   const oldKey=m.file.replace(/\.webp$/,'');
   const count=Number(gets2[m.id]||0);
   if(count) discovered++;
   const card=document.createElement('article');card.className='book-card'+(count?'':' locked');
   const img=document.createElement('img');img.src=MONSTER_BASE+m.path+'/'+m.file;img.alt=count?m.name:'未発見のモンスター';img.loading='lazy';
   const name=document.createElement('span');name.textContent=count?m.name:'？？？';
   const small=document.createElement('small');small.textContent=count?'ゲット × '+count:'未発見';
   card.append(img,name,small);wrap.appendChild(card);
 });
 grid.appendChild(wrap);
}
document.getElementById('bookProgress').textContent=discovered+' / '+MONSTERS.length+' 種';
document.getElementById('bookBack').onclick=()=>location.href='./';
</script>
</body></html>
