<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ANGLE HUNTER - ナビアンをつかまえろ</title>
<style>
:root{--deep:#080d26;--panel:rgba(12,18,48,.78);--green:#6ee7a8;--purple:#b389ff;--gold:#ffd23f;--coral:#ff7a6b;--ink:#f5f6ff;--dim:#aeb4dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:var(--deep);color:var(--ink);touch-action:manipulation}
body{display:flex;justify-content:center}#app{width:100%;height:100%;max-width:1100px;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:0 0 auto}.title h1{margin:0;color:var(--green);font-size:clamp(1.15rem,3vw,1.6rem);letter-spacing:.05em}.title p{margin:2px 0 0;color:var(--dim);font-size:.72rem}.levels{display:flex;gap:6px}.level{border:1px solid rgba(179,137,255,.45);background:var(--panel);color:var(--dim);border-radius:999px;padding:7px 11px;font:inherit;font-size:.75rem;min-height:40px}.level.active{background:var(--purple);color:var(--deep);font-weight:700}
main{min-height:0;flex:1;display:flex;gap:12px}.stage-wrap{min-width:0;flex:1;display:flex;align-items:center;justify-content:center}.stage{position:relative;width:min(76vh,calc(100vw - 300px),620px);height:min(76vh,calc(100vw - 300px),620px);min-width:300px;min-height:300px;border-radius:50%;overflow:hidden;border:2px solid rgba(179,137,255,.55);box-shadow:0 0 35px rgba(45,58,140,.45),inset 0 0 50px rgba(7,10,35,.55);background-size:cover;background-position:center;transition:background-image .35s}
.stage:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 0 42%,rgba(5,8,25,.34) 100%);pointer-events:none;z-index:0}.backdrop{position:absolute;inset:0;background:rgba(245,248,255,.16);z-index:1;pointer-events:none}.field{position:absolute;inset:0;width:100%;height:100%;z-index:2}.zero-line{position:absolute;z-index:3;left:50%;top:50%;height:3px;width:155px;background:rgba(8,13,26,.88);transform:translateY(-50%);transform-origin:0 50%;box-shadow:0 0 5px rgba(255,255,255,.28);pointer-events:none}.zero-line:after{content:"0°";position:absolute;right:-18px;top:-18px;color:rgba(8,13,26,.9);font-size:10px;font-weight:700}.aim{position:absolute;z-index:3;left:50%;top:50%;height:2px;background:var(--green);transform-origin:0 50%;box-shadow:0 0 8px rgba(110,231,168,.45);pointer-events:none;opacity:0;transition:opacity .2s}.aim.show{opacity:1}.aim:after{content:"";position:absolute;right:-2px;top:-5px;border-left:11px solid var(--green);border-top:5px solid transparent;border-bottom:5px solid transparent}.center{position:absolute;z-index:5;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);transform:translate(-50%,-50%)}
.navian{position:absolute;width:86px;height:86px;object-fit:contain;transform:translate(-50%,-50%);z-index:4;filter:drop-shadow(0 5px 7px rgba(0,0,0,.45));transition:opacity .2s,transform .25s,filter .25s}.navian.running{filter:drop-shadow(0 5px 8px rgba(0,0,0,.55));animation:runBounce .18s ease-in-out infinite alternate}.navian.caught{opacity:0;transform:translate(-50%,-50%) scale(1.35);filter:drop-shadow(0 0 18px var(--gold))}.navian.escape{animation:escape .45s ease-in forwards}@keyframes runBounce{from{margin-top:-2px}to{margin-top:2px}}@keyframes escape{to{opacity:0;transform:translate(-50%,-50%) scale(.72) rotate(10deg)}}
.net{position:absolute;z-index:6;left:50%;top:50%;height:3px;width:0;background:var(--ink);border-radius:99px;transform-origin:0 50%;opacity:0}.net.right{background:var(--gold);box-shadow:0 0 10px var(--gold)}.net.wrong{background:var(--coral);box-shadow:0 0 10px var(--coral)}
.correct-line{position:absolute;z-index:3;left:50%;top:50%;height:3px;width:0;background:var(--gold);opacity:0;transform-origin:0 50%;border-radius:99px;box-shadow:0 0 9px rgba(255,210,63,.6)}.correct-line.show{opacity:.9}
.message{position:absolute;z-index:8;left:50%;top:7%;transform:translateX(-50%);padding:7px 18px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(8,13,38,.82);font-size:.95rem;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .18s}.message.show{opacity:1}.message.hit{color:var(--gold);border-color:var(--gold)}.message.miss{color:var(--coral);border-color:var(--coral)}
.side{width:210px;display:flex;flex-direction:column;gap:9px}.panel{background:var(--panel);border:1px solid rgba(179,137,255,.3);border-radius:14px;padding:10px 12px;backdrop-filter:blur(5px)}.panel h2{margin:0 0 6px;font-size:.72rem;color:var(--dim);font-weight:500}.stat{display:flex;justify-content:space-between;padding:2px 0;font-size:.82rem}.stat b{color:var(--gold)}.weak{display:flex;flex-wrap:wrap;gap:4px}.tag{padding:3px 7px;border-radius:8px;background:rgba(255,122,107,.15);color:var(--coral);font-size:.72rem}
#angles{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;flex:0 0 auto}.angle{min-height:48px;border:1px solid rgba(179,137,255,.35);background:var(--panel);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;font-size:.9rem;touch-action:manipulation}.angle:active{transform:scale(.95)}.angle.wrong{background:var(--coral);color:var(--deep);border-color:var(--coral)}.angle.correct{background:var(--gold);color:var(--deep);border-color:var(--gold)}#next{display:none;align-self:center;border:0;border-radius:999px;background:var(--green);color:var(--deep);font:inherit;font-weight:700;padding:11px 24px;min-height:46px;touch-action:manipulation}
@media(pointer:coarse),(max-width:1050px){#app{padding:8px 10px 10px}.title p{display:none}main{display:block;position:relative}.stage-wrap{height:calc(100% - 2px)}.stage{width:min(88vw,62vh);height:min(88vw,62vh);min-width:280px;min-height:280px}.side{position:absolute;left:0;right:0;bottom:0;width:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;z-index:10;pointer-events:none}.side .panel{pointer-events:auto;padding:7px 9px}.side .panel:nth-child(2){display:none}.panel h2{margin-bottom:2px}.stat{font-size:.7rem}.navian{width:78px;height:78px}#angles{grid-template-columns:repeat(6,1fr);gap:5px}.angle{min-height:48px;font-size:.82rem}.level{padding:7px 10px;font-size:.72rem;min-height:42px}}
@media(max-width:600px){#app{gap:5px}.stage{width:min(91vw,56vh);height:min(91vw,56vh)}.navian{width:68px;height:68px}.angle{min-height:44px;font-size:.76rem}.side .panel{padding:5px 7px}.stat{font-size:.65rem}}
</style>
</head>
<body>
<div id="app">
<header><div class="title"><h1>ANGLE HUNTER</h1><p>角度を見抜け。ナビアンをつかまえろ。</p></div><div class="levels"><button class="level active" data-step="30">かんたん 30°</button><button class="level" data-step="15">ふつう 15°</button></div></header>
<main><div class="stage-wrap"><div class="stage" id="stage"><div class="backdrop"></div><svg class="field" viewBox="0 0 400 400" aria-hidden="true" id="field"></svg><div class="zero-line"></div><div class="aim" id="aim"></div><div class="correct-line" id="correctLine"></div><div class="net" id="net"></div><div class="center"></div><img class="navian" id="navian" alt="ナビアン"><div class="message" id="message"></div></div></div>
<div class="side"><div class="panel"><h2>きろく</h2><div class="stat"><span>ちょうせん</span><b id="attempts">0</b></div><div class="stat"><span>せいかい</span><b id="correct">0</b></div><div class="stat"><span>せいとうりつ</span><b id="rate">0%</b></div><div class="stat"><span>さいこう連続</span><b id="streak">0</b></div></div><div class="panel"><h2>にがてな角度</h2><div class="weak" id="weak">まだデータなし</div></div></div></main>
<div id="angles"></div><button id="next">つぎのナビアン ▶</button>
</div>
<script>
(()=>{
const BASE='https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/fantasy/monsters/zako/';
const NAVIANS=['acorn-leafy.webp','aurora-shell-lizard.webp','autumn-mushroom.webp','berry-leafy.webp','bubblefin-frog.webp','candy-coral-slug.webp','cloud-rain-rabbit.webp','clover-mandragora.webp','cobalt-blade-mantis.webp','coral-bubble-crab.webp','dusk-feather-owl.webp','forest-puru.webp','happa-squirrel-leafy.webp','hinoko-ember-newt.webp','kinoko-apple-mushroom.webp','komorin-little-night-bat.webp','koro-golem-pebble-golem.webp','mofu-wolf-frost-pup.webp','purun-little-magic-slime.webp','yukimaru-snow-puff.webp'];
const BACKGROUNDS=['forest.jpeg','grassland.jpeg','hill.jpeg','palace.jpeg','starry-sky.jpeg','sunset.jpeg','volcano.jpeg','waterfall.jpeg'].map(x=>'https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/fantasy/cards/backgrounds/'+x);
const C={cx:200,cy:200,r:155,navR:132,storage:'angleHunter.stats.v2'};
const $=id=>document.getElementById(id);const stage=$('stage'),field=$('field'),navian=$('navian'),aim=$('aim'),net=$('net'),correctLine=$('correctLine'),message=$('message'),angles=$('angles'),next=$('next');
let step=30,answer=null,answered=false,runningToken=0,stats=load();
function load(){try{return JSON.parse(localStorage.getItem(C.storage))||{attempts:0,correct:0,streak:0,best:0,angles:{}}}catch{return{attempts:0,correct:0,streak:0,best:0,angles:{}}}}
function save(){localStorage.setItem(C.storage,JSON.stringify(stats))}
function point(deg,r=C.navR){const rad=-deg*Math.PI/180;return{x:C.cx+Math.cos(rad)*r,y:C.cy+Math.sin(rad)*r}}
function cssPoint(deg,r=C.navR){const p=point(deg,r);return{left:(p.x/4)+'%',top:(p.y/4)+'%'}}
function setNavianPoint(deg){const pos=cssPoint(deg);navian.style.left=pos.left;navian.style.top=pos.top}
function line(el,deg,len){el.style.width=len+'px';el.style.transform=`rotate(${-deg}deg)`}
function drawField(){field.innerHTML='';const ns='http://www.w3.org/2000/svg';for(let d=0;d<360;d+=step){const a=-d*Math.PI/180;const major=d%30===0;const r1=major?133:141;const x1=200+Math.cos(a)*r1,y1=200+Math.sin(a)*r1,x2=200+Math.cos(a)*155,y2=200+Math.sin(a)*155;const l=document.createElementNS(ns,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke',major?'rgba(8,13,26,.82)':'rgba(8,13,26,.38)');l.setAttribute('stroke-width',major?'2':'1');field.appendChild(l);if(d%30===0){const t=document.createElementNS(ns,'text');const tx=200+Math.cos(a)*116,ty=200+Math.sin(a)*116+4;t.setAttribute('x',tx);t.setAttribute('y',ty);t.setAttribute('text-anchor','middle');t.setAttribute('fill','rgba(8,13,26,.86)');t.setAttribute('font-size','11');t.textContent=d+'°';field.appendChild(t)}}const c=document.createElementNS(ns,'circle');c.setAttribute('cx',200);c.setAttribute('cy',200);c.setAttribute('r',155);c.setAttribute('fill','none');c.setAttribute('stroke','rgba(8,13,26,.42)');c.setAttribute('stroke-width','1.5');field.appendChild(c)}
function buildAngles(){angles.innerHTML='';for(let d=0;d<360;d+=step){const b=document.createElement('button');b.className='angle';b.textContent=d+'°';b.dataset.angle=d;b.onclick=()=>choose(d,b);angles.appendChild(b)}}
function runNavianToTarget(token){const start=performance.now();const duration=850+answer*3.1;navian.classList.add('running');aim.classList.remove('show');function frame(now){if(token!==runningToken)return;const t=Math.min(1,(now-start)/duration);setNavianPoint(answer*t);if(t<1){requestAnimationFrame(frame)}else{setNavianPoint(answer);navian.classList.remove('running');aim.classList.add('show');buildAngles()}}requestAnimationFrame(frame)}
function spawn(){runningToken++;const token=runningToken;answered=false;next.style.display='none';message.className='message';message.textContent='';correctLine.className='correct-line';correctLine.style.width='0';correctLine.style.opacity='0';net.className='net';net.style.width='0';net.style.opacity='0';navian.className='navian';aim.classList.remove('show');aim.style.width='0';answer=Math.floor(Math.random()*(360/step))*step;const img=NAVIANS[Math.floor(Math.random()*NAVIANS.length)];const bg=BACKGROUNDS[Math.floor(Math.random()*BACKGROUNDS.length)];navian.src=BASE+img;stage.style.backgroundImage=`url(${bg})`;setNavianPoint(0);line(aim,answer,C.navR);aim.style.width=C.navR+'px';angles.innerHTML='';runNavianToTarget(token)}
function choose(picked,button){if(answered)return;answered=true;document.querySelectorAll('.angle').forEach(b=>b.disabled=true);stats.attempts++;stats.angles[answer]=stats.angles[answer]||{a:0,c:0};stats.angles[answer].a++;const hit=picked===answer;if(hit){button.classList.add('correct');stats.correct++;stats.streak++;stats.best=Math.max(stats.best,stats.streak);stats.angles[answer].c++;line(net,picked,C.navR);net.classList.add('right');net.style.opacity='1';setMessage('GET！ 大せいかい！','hit');navian.classList.add('caught')}else{button.classList.add('wrong');stats.streak=0;line(net,picked,C.navR);net.classList.add('wrong');net.style.opacity='1';const diff=Math.min((picked-answer+360)%360,(answer-picked+360)%360);setMessage(`はずれ… ${diff}°ずれてたよ`,'miss');navian.classList.add('escape');setTimeout(()=>{if(!answered)return;line(correctLine,answer,C.navR);correctLine.classList.add('show')},260);const right=document.querySelector(`.angle[data-angle="${answer}"]`);if(right)right.classList.add('correct')}save();update();setTimeout(()=>next.style.display='block',650)}
function setMessage(text,kind){message.textContent=text;message.className='message show '+kind}
function update(){$('attempts').textContent=stats.attempts;$('correct').textContent=stats.correct;$('rate').textContent=stats.attempts?Math.round(stats.correct/stats.attempts*100)+'%':'0%';$('streak').textContent=stats.best;const weak=Object.entries(stats.angles).filter(([a,v])=>v.a>=2&&v.c/v.a<.6).sort((x,y)=>x[1].c/x[1].a-y[1].c/y[1].a).slice(0,5);$('weak').innerHTML=weak.length?weak.map(([a])=>`<span class="tag">${a}°</span>`).join(''):'まだデータなし'}
document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawField();spawn()});next.onclick=spawn;drawField();update();spawn();
})();
</script>
</body>
</html>
