<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ANGLE HUNTER - ナビアンをつかまえろ</title>
<style>
:root{--deep:#080d26;--panel:rgba(12,18,48,.86);--green:#6ee7a8;--purple:#b389ff;--gold:#ffd23f;--coral:#ff7a6b;--ink:#f5f6ff;--dim:#aeb4dc}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:var(--deep);color:var(--ink);touch-action:manipulation}button{font:inherit;cursor:pointer}body{display:flex;justify-content:center}#app{width:100%;height:100%;max-width:1100px;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}.hidden{display:none!important}
#start{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(rgba(8,13,38,.35),rgba(8,13,38,.72)),url('https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/fantasy/backgrounds/town.png') center/cover}.start-card{width:min(920px,100%);max-height:94vh;overflow:auto;padding:clamp(22px,5vw,48px);border:1px solid rgba(255,255,255,.3);border-radius:28px;background:rgba(8,13,38,.78);backdrop-filter:blur(8px);box-shadow:0 20px 70px rgba(0,0,0,.4)}.start-head{display:flex;align-items:center;gap:20px}.town-group{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}.start-title h1{margin:0;color:var(--green);font-size:clamp(2rem,6vw,4rem);letter-spacing:.06em}.start-title p{margin:7px 0 0;color:var(--dim);font-size:clamp(.85rem,2vw,1.05rem)}.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.mode{min-height:145px;padding:18px;border:1px solid rgba(179,137,255,.4);border-radius:18px;background:rgba(12,18,48,.86);color:var(--ink);text-align:left;transition:.15s}.mode:hover,.mode:active{transform:translateY(-2px);border-color:var(--green)}.mode b{display:block;font-size:1.1rem;margin-bottom:8px}.mode span{display:block;color:var(--dim);font-size:.78rem;line-height:1.7}.mode .mode-mark{font-size:1.7rem;margin-bottom:10px;color:var(--gold)}.start-note{text-align:center;color:var(--dim);font-size:.72rem;margin:20px 0 0}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:0 0 auto}.title h1{margin:0;color:var(--green);font-size:clamp(1.15rem,3vw,1.6rem);letter-spacing:.05em}.title p{margin:2px 0 0;color:var(--dim);font-size:.72rem}.head-actions{display:flex;gap:6px;align-items:center}.levels{display:flex;gap:6px}.level,.head-btn{border:1px solid rgba(179,137,255,.45);background:var(--panel);color:var(--dim);border-radius:999px;padding:7px 11px;font-size:.75rem;min-height:40px}.level.active{background:var(--purple);color:var(--deep);font-weight:700}.head-btn{color:var(--ink)}
main{min-height:0;flex:1;display:flex;gap:12px}.stage-wrap{min-width:0;flex:1;display:flex;align-items:center;justify-content:center}.stage{position:relative;width:min(76vh,calc(100vw - 300px),620px);height:min(76vh,calc(100vw - 300px),620px);min-width:300px;min-height:300px;border-radius:50%;overflow:hidden;border:2px solid rgba(179,137,255,.55);box-shadow:0 0 35px rgba(45,58,140,.45),inset 0 0 50px rgba(7,10,35,.55);background-size:cover;background-position:center}.stage:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 0 42%,rgba(5,8,25,.34) 100%);pointer-events:none;z-index:0}.backdrop{position:absolute;inset:0;background:rgba(245,248,255,.16);z-index:1;pointer-events:none}.field{position:absolute;inset:0;width:100%;height:100%;z-index:2}.zero-line{position:absolute;z-index:3;left:50%;top:50%;height:3px;width:155px;background:rgba(8,13,26,.88);transform:translateY(-50%);transform-origin:0 50%;box-shadow:0 0 5px rgba(255,255,255,.28);pointer-events:none}.zero-line:after{content:"0°";position:absolute;right:-18px;top:-18px;color:rgba(8,13,26,.9);font-size:10px;font-weight:700}.aim{position:absolute;z-index:3;left:50%;top:50%;height:2px;background:var(--green);transform-origin:0 50%;box-shadow:0 0 8px rgba(110,231,168,.45);pointer-events:none;opacity:0}.aim.show{opacity:1}.aim:after{content:"";position:absolute;right:-2px;top:-5px;border-left:11px solid var(--green);border-top:5px solid transparent;border-bottom:5px solid transparent}.center{position:absolute;z-index:5;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);transform:translate(-50%,-50%)}.navian{position:absolute;width:86px;height:86px;object-fit:contain;transform:translate(-50%,-50%);z-index:4;filter:drop-shadow(0 5px 7px rgba(0,0,0,.45));transition:opacity .2s,transform .25s}.navian.running{animation:runBounce .18s ease-in-out infinite alternate}.navian.caught{opacity:0;transform:translate(-50%,-50%) scale(1.35);filter:drop-shadow(0 0 18px var(--gold))}@keyframes runBounce{from{margin-top:-2px}to{margin-top:2px}}.net{position:absolute;z-index:6;left:50%;top:50%;height:3px;width:0;background:var(--ink);border-radius:99px;transform-origin:0 50%;opacity:0}.net.right{background:var(--gold);box-shadow:0 0 10px var(--gold)}.net.wrong{background:var(--coral);box-shadow:0 0 10px var(--coral)}.correct-line{position:absolute;z-index:3;left:50%;top:50%;height:3px;width:0;background:var(--gold);opacity:0;transform-origin:0 50%;border-radius:99px;box-shadow:0 0 9px rgba(255,210,63,.6)}.correct-line.show{opacity:.9}.message{position:absolute;z-index:8;left:50%;top:7%;transform:translateX(-50%);padding:7px 18px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(8,13,38,.84);font-size:.95rem;font-weight:700;white-space:nowrap;opacity:0}.message.show{opacity:1}.message.hit{color:var(--gold);border-color:var(--gold)}.message.miss{color:var(--coral);border-color:var(--coral)}
.side{width:210px;display:flex;flex-direction:column;gap:9px}.panel{background:var(--panel);border:1px solid rgba(179,137,255,.3);border-radius:14px;padding:10px 12px;backdrop-filter:blur(5px)}.panel h2{margin:0 0 6px;font-size:.72rem;color:var(--dim);font-weight:500}.stat{display:flex;justify-content:space-between;padding:2px 0;font-size:.82rem}.stat b{color:var(--gold)}.weak{display:flex;flex-wrap:wrap;gap:4px}.tag{padding:3px 7px;border-radius:8px;background:rgba(255,122,107,.15);color:var(--coral);font-size:.72rem}.challenge-timer{font-size:1.55rem!important;color:var(--gold)!important}.challenge-score{font-size:1.35rem!important;color:var(--green)!important}
#angles{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;flex:0 0 auto}.angle{min-height:48px;border:1px solid rgba(179,137,255,.35);background:var(--panel);color:var(--ink);border-radius:12px;font-weight:700;font-size:.9rem;touch-action:manipulation}.angle:active{transform:scale(.95)}.angle.wrong{background:var(--coral);color:var(--deep);border-color:var(--coral)}.angle.correct{background:var(--gold);color:var(--deep);border-color:var(--gold)}#next{display:none;align-self:center;border:0;border-radius:999px;background:var(--green);color:var(--deep);font-weight:700;padding:11px 24px;min-height:46px}
#book{position:fixed;inset:0;z-index:45;background:var(--deep);display:flex;align-items:center;justify-content:center}.book-shell{width:min(1000px,100%);height:100%;overflow:auto;padding:18px}.book-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.book-head h2{margin:0;color:var(--green)}.book-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.book-card{background:var(--panel);border:1px solid rgba(179,137,255,.28);border-radius:14px;padding:10px;text-align:center}.book-card img{width:100%;height:120px;object-fit:contain}.book-card span{display:block;color:var(--dim);font-size:.67rem;line-height:1.4;margin-top:5px;word-break:break-word}
#result{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(8,13,38,.82);backdrop-filter:blur(8px)}.result-card{width:min(520px,100%);text-align:center;padding:36px 24px;border:1px solid rgba(255,255,255,.25);border-radius:24px;background:var(--panel)}.result-card h2{margin:0;color:var(--gold);font-size:2rem}.result-number{font-size:4.5rem;color:var(--green);font-weight:800;line-height:1.1;margin:15px 0}.result-card p{color:var(--dim)}.result-actions{display:flex;gap:8px;justify-content:center}.result-actions button{border:0;border-radius:999px;padding:12px 24px;min-height:46px}.again{background:var(--green);color:var(--deep);font-weight:700}.title-back{background:rgba(179,137,255,.18);color:var(--ink)}
@media(pointer:coarse),(max-width:1050px){#app{padding:8px 10px 10px}.title p{display:none}main{display:block;position:relative}.stage-wrap{height:calc(100% - 2px)}.stage{width:min(88vw,62vh);height:min(88vw,62vh);min-width:280px;min-height:280px}.side{position:absolute;left:0;right:0;bottom:0;width:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;z-index:10;pointer-events:none}.side .panel{pointer-events:auto;padding:7px 9px}.side .panel:nth-child(2){display:none}.panel h2{margin-bottom:2px}.stat{font-size:.7rem}.navian{width:78px;height:78px}.mode-grid{grid-template-columns:1fr}.mode{min-height:90px}.start-head{align-items:flex-start}.town-group{width:90px;height:90px}#angles{grid-template-columns:repeat(6,1fr);gap:5px}.angle{min-height:48px;font-size:.82rem}.level,.head-btn{padding:7px 10px;font-size:.72rem;min-height:42px}.book-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){#app{gap:5px}.stage{width:min(91vw,56vh);height:min(91vw,56vh)}.navian{width:68px;height:68px}.angle{min-height:44px;font-size:.76rem}.side .panel{padding:5px 7px}.stat{font-size:.65rem}.book-grid{grid-template-columns:repeat(3,1fr)}.book-card img{height:90px}.start-card{padding:22px 16px}.start-head{gap:10px}.town-group{width:72px;height:72px}.start-title h1{font-size:1.65rem}.head-actions{gap:3px}.levels{gap:3px}}
</style>
</head>
<body>
<div id="start"><div class="start-card"><div class="start-head"><img class="town-group" src="https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/fantasy/groups/group-fantasy-town.png" alt="ナビアンのなかまたち"><div class="start-title"><h1>ANGLE HUNTER</h1><p>角度を見抜け。ナビアンをつかまえろ。</p></div></div><div class="mode-grid"><button class="mode" data-mode="hunter"><span class="mode-mark">◈</span><b>ハンターモード</b><span>角度を見抜いてナビアンを捕獲。じっくり正確にハントしよう。</span></button><button class="mode" data-mode="challenge"><span class="mode-mark">◆</span><b>チャレンジモード</b><span>60秒のスコアアタック。正解なら捕獲、ミスしても即次へ。捕獲数を競おう。</span></button><button class="mode" data-mode="book"><span class="mode-mark">▣</span><b>ナビアン図鑑</b><span>出会えるナビアンを一覧でチェック。角度ハンターの仲間たちを見てみよう。</span></button></div><p class="start-note">学びながら、見抜いて、つかまえよう。</p></div></div>
<div id="app" class="hidden"><header><div class="title"><h1>ANGLE HUNTER</h1><p>角度を見抜け。ナビアンをつかまえろ。</p></div><div class="head-actions"><div class="levels"><button class="level active" data-step="30">30°</button><button class="level" data-step="15">15°</button></div><button class="head-btn" id="titleBtn">タイトル</button></div></header><main><div class="stage-wrap"><div class="stage" id="stage"><div class="backdrop"></div><svg class="field" viewBox="0 0 400 400" aria-hidden="true" id="field"></svg><div class="zero-line"></div><div class="aim" id="aim"></div><div class="correct-line" id="correctLine"></div><div class="net" id="net"></div><div class="center"></div><img class="navian" id="navian" alt="ナビアン"><div class="message" id="message"></div></div></div><div class="side"><div class="panel"><h2 id="recordTitle">きろく</h2><div class="stat"><span>ちょうせん</span><b id="attempts">0</b></div><div class="stat"><span>せいかい</span><b id="correct">0</b></div><div class="stat"><span>せいとうりつ</span><b id="rate">0%</b></div><div class="stat"><span>さいこう連続</span><b id="streak">0</b></div></div><div class="panel"><h2>にがてな角度</h2><div class="weak" id="weak">まだデータなし</div></div></div></main><div id="angles"></div><button id="next">つぎのナビアン ▶</button></div>
<div id="result" class="hidden"><div class="result-card"><h2>TIME UP!</h2><div class="result-number" id="resultScore">0</div><p>匹のナビアンを捕獲！</p><div class="result-actions"><button class="again" id="again">もう一度</button><button class="title-back" id="resultTitle">タイトルへ</button></div></div></div>
<div id="book" class="hidden"><div class="book-shell"><div class="book-head"><h2>ナビアン図鑑</h2><button class="head-btn" id="bookBack">タイトルへ</button></div><div class="book-grid" id="bookGrid"></div></div></div>
<script>
(()=>{const BASE='https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/web/fantasy/monsters/zako/';const NAVIANS=['acorn-leafy.webp','aurora-shell-lizard.webp','autumn-mushroom.webp','berry-leafy.webp','bubblefin-frog.webp','candy-coral-slug.webp','cloud-rain-rabbit.webp','clover-mandragora.webp','cobalt-blade-mantis.webp','coral-bubble-crab.webp','dusk-feather-owl.webp','forest-puru.webp','happa-squirrel-leafy.webp','hinoko-ember-newt.webp','kinoko-apple-mushroom.webp','komorin-little-night-bat.webp','koro-golem-pebble-golem.webp','mofu-wolf-frost-pup.webp','purun-little-magic-slime.webp','yukimaru-snow-puff.webp'];const BACKGROUNDS=['forest.jpeg','grassland.jpeg','hill.jpeg','palace.jpeg','starry-sky.jpeg','sunset.jpeg','volcano.jpeg','waterfall.jpeg'].map(x=>'https://raw.githubusercontent.com/TT-sensei/navi-character-/main/assets/fantasy/cards/backgrounds/'+x);const $=id=>document.getElementById(id),start=$('start'),app=$('app'),book=$('book'),result=$('result'),stage=$('stage'),field=$('field'),navian=$('navian'),aim=$('aim'),net=$('net'),correctLine=$('correctLine'),message=$('message'),angles=$('angles'),next=$('next');let step=30,mode='hunter',answer=null,answered=false,runningToken=0,challengeScore=0,challengeTime=60,timerId=null,stats=load();function load(){try{return JSON.parse(localStorage.getItem('angleHunter.stats.v2'))||{attempts:0,correct:0,streak:0,best:0,angles:{}}}catch{return{attempts:0,correct:0,streak:0,best:0,angles:{}}}}function save(){localStorage.setItem('angleHunter.stats.v2',JSON.stringify(stats))}function point(deg,r=132){const rad=-deg*Math.PI/180;return{x:200+Math.cos(rad)*r,y:200+Math.sin(rad)*r}}function setNavianPoint(deg){const p=point(deg);navian.style.left=p.x/4+'%';navian.style.top=p.y/4+'%'}function line(el,deg,len){el.style.width=len+'px';el.style.transform=`rotate(${-deg}deg)`}function drawField(){field.innerHTML='';const ns='http://www.w3.org/2000/svg';for(let d=0;d<360;d+=step){const a=-d*Math.PI/180,major=d%30===0,r1=major?133:141,x1=200+Math.cos(a)*r1,y1=200+Math.sin(a)*r1,x2=200+Math.cos(a)*155,y2=200+Math.sin(a)*155,l=document.createElementNS(ns,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke',major?'rgba(8,13,26,.82)':'rgba(8,13,26,.38)');l.setAttribute('stroke-width',major?'2':'1');field.appendChild(l);if(d%30===0){const t=document.createElementNS(ns,'text');t.setAttribute('x',200+Math.cos(a)*116);t.setAttribute('y',200+Math.sin(a)*116+4);t.setAttribute('text-anchor','middle');t.setAttribute('fill','rgba(8,13,26,.86)');t.setAttribute('font-size','11');t.textContent=d+'°';field.appendChild(t)}}const c=document.createElementNS(ns,'circle');c.setAttribute('cx',200);c.setAttribute('cy',200);c.setAttribute('r',155);c.setAttribute('fill','none');c.setAttribute('stroke','rgba(8,13,26,.42)');c.setAttribute('stroke-width','1.5');field.appendChild(c)}function buildAngles(){angles.innerHTML='';for(let d=0;d<360;d+=step){const b=document.createElement('button');b.className='angle';b.textContent=d+'°';b.dataset.angle=d;b.onclick=()=>choose(d,b);angles.appendChild(b)}}function resetLines(){correctLine.className='correct-line';correctLine.style.width='0';correctLine.style.opacity='0';net.className='net';net.style.width='0';net.style.opacity='0';aim.classList.remove('show');aim.style.width='0'}function spawn(){runningToken++;const token=runningToken;answered=false;next.style.display='none';message.className='message';message.textContent='';resetLines();navian.className='navian';answer=Math.floor(Math.random()*(360/step))*step;navian.src=BASE+NAVIANS[Math.floor(Math.random()*NAVIANS.length)];stage.style.backgroundImage=`url(${BACKGROUNDS[Math.floor(Math.random()*BACKGROUNDS.length)]})`;setNavianPoint(0);const started=performance.now(),duration=mode==='challenge'?420:850+answer*3.1;navian.classList.add('running');function frame(now){if(token!==runningToken)return;const t=Math.min(1,(now-started)/duration);setNavianPoint(answer*t);if(t<1)requestAnimationFrame(frame);else{setNavianPoint(answer);navian.classList.remove('running');aim.classList.add('show');buildAngles()}}requestAnimationFrame(frame)}function updateStats(){$('attempts').textContent=stats.attempts;$('correct').textContent=stats.correct;$('rate').textContent=stats.attempts?Math.round(stats.correct/stats.attempts*100)+'%':'0%';$('streak').textContent=stats.best;const weak=Object.entries(stats.angles).sort((a,b)=>b[1].wrong-a[1].wrong).filter(x=>x[1].wrong).slice(0,4);$('weak').innerHTML=weak.length?weak.map(([d,v])=>`<span class="tag">${d}° ×${v.wrong}</span>`).join(''):'まだデータなし'}function choose(d,b){if(answered|| (mode==='challenge'&&challengeTime<=0))return;answered=true;const ok=d===answer;stats.attempts++;stats.angles[d]??={right:0,wrong:0};if(ok){stats.correct++;stats.streak++;stats.best=Math.max(stats.best,stats.streak);stats.angles[d].right++;b.classList.add('correct');line(net,d,132);net.classList.add('right');net.style.opacity='1';line(correctLine,answer,132);correctLine.classList.add('show');navian.classList.add('caught');message.className='message hit show';message.textContent='GET!';}else{stats.streak=0;stats.angles[d].wrong++;b.classList.add('wrong');line(net,d,132);net.classList.add('wrong');net.style.opacity='1';line(correctLine,answer,132);correctLine.classList.add('show');message.className='message miss show';message.textContent=`はずれ… 正解は ${answer}°`;}
save();updateStats();if(mode==='challenge'){if(ok)challengeScore++;setTimeout(()=>{if(challengeTime>0)spawn()},120)}else{next.style.display='block';if(!ok){const cb=[...angles.children].find(x=>+x.dataset.angle===answer);if(cb)cb.classList.add('correct')}}}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}function startHunter(){stopTimer();mode='hunter';start.classList.add('hidden');book.classList.add('hidden');result.classList.add('hidden');app.classList.remove('hidden');$('recordTitle').textContent='きろく';drawField();spawn();updateStats()}function startChallenge(){stopTimer();mode='challenge';challengeScore=0;challengeTime=60;start.classList.add('hidden');book.classList.add('hidden');result.classList.add('hidden');app.classList.remove('hidden');$('recordTitle').innerHTML='のこり <b class="challenge-timer" id="timer">60</b> 秒';$('correct').className='challenge-score';$('correct').textContent='0';$('attempts').textContent='捕獲数';$('rate').textContent='';$('streak').textContent='';$('weak').textContent='60秒で何匹？';drawField();spawn();timerId=setInterval(()=>{challengeTime--;const t=$('timer');if(t)t.textContent=challengeTime;if(challengeTime<=0)endChallenge()},1000)}function endChallenge(){if(challengeTime!==0)return;stopTimer();runningToken++;result.classList.remove('hidden');$('resultScore').textContent=challengeScore;angles.innerHTML='';navian.className='navian'}function showBook(){stopTimer();app.classList.add('hidden');start.classList.add('hidden');result.classList.add('hidden');book.classList.remove('hidden');$('bookGrid').innerHTML=NAVIANS.map((n,i)=>`<div class="book-card"><img src="${BASE+n}" alt="ナビアン ${i+1}"><span>${n.replace('.webp','').replaceAll('-',' ')}</span></div>`).join('')}function title(){stopTimer();runningToken++;result.classList.add('hidden');app.classList.add('hidden');book.classList.add('hidden');start.classList.remove('hidden')}function setStep(v){step=v;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('active',+x.dataset.step===step));if(!app.classList.contains('hidden')){drawField();spawn()}}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>b.dataset.mode==='hunter'?startHunter():b.dataset.mode==='challenge'?startChallenge():showBook());document.querySelectorAll('.level').forEach(b=>b.onclick=()=>setStep(+b.dataset.step));next.onclick=spawn;$('titleBtn').onclick=title;$('bookBack').onclick=title;$('again').onclick=startChallenge;$('resultTitle').onclick=title;drawField()})();
</script>
</body></html>
