name: Fix game tablet layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add tablet game overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          patch = '''@media(max-width:1050px){
          .game{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;min-height:0}
          .arena-wrap{min-height:0;padding:10px}
          .arena{width:min(64vh,82vw);height:min(64vh,82vw);min-width:300px;min-height:300px}
          .side{position:absolute;top:62px;right:10px;width:185px;z-index:15}
          .protractor-card{width:96%;max-width:760px}
          }
          @media(max-width:700px){
          .arena{width:min(58vh,84vw);height:min(58vh,84vw);min-width:280px;min-height:280px}
          .side{width:160px;right:8px}
          .protractor-card{width:98%}
          .protractor-navian{width:64px;height:64px}
          }
          '''
          if '@media(max-width:700px){\n          .arena{width:min(58vh,84vw)' not in s:
              s = s.replace('</style>', patch + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: optimize game layout on tablets" || true
          git rm .github/workflows/fix-game-tablet.yml
          git commit -m "chore: remove temporary game layout workflow"
          git push