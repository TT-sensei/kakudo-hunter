name: repair wrong advance
on:
  issues:
    types: [opened]
jobs:
  repair:
    if: github.event.issue.title == 'ANGLE-HUNTER-repair'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "b.addEventListener('pointerup',choose);b.addEventListener('click',choose);"
          new = "b.addEventListener('pointerup',choose);"
          if old not in s:
              raise SystemExit('input event pattern not found')
          s = s.replace(old, new, 1)
          old = "if(mode==='challenge')setTimeout(()=>{if(timeLeft>0)spawn()},ok?260:380);else $('next').style.display='block'"
          new = "setTimeout(()=>{if(mode!=='challenge'||timeLeft>0)spawn()},ok?260:1000)"
          if old not in s:
              raise SystemExit('advance pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix auto advance after wrong answers' || true
          git rm .github/workflows/repair-wrong-advance.yml
          git commit -m 'chore remove repair workflow'
          git push
