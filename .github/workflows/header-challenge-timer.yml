name: Move challenge countdown to header
on:
  push:
    paths:
      - '.github/workflows/trigger-header-challenge-timer.txt'
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put countdown in header
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="actions"><span class="pill active" id="stepLabel">30°</span><button class="head-btn" id="titleBtn">タイトル</button></div>'
          new='<div class="actions"><span class="pill active" id="stepLabel">30°</span><span class="challenge-header-timer hidden" id="timer">60</span><button class="head-btn" id="titleBtn">タイトル</button></div>'
          if old not in s: raise SystemExit('header target not found')
          s=s.replace(old,new,1)
          old2='<div class="panel" id="challengePanel"><h2>チャレンジ</h2><div class="stat"><span>のこり時間</span><b class="challenge-timer" id="timer">60</b></div><div class="stat"><span>捕獲数</span><b class="challenge-score" id="score">0</b></div></div>'
          new2='<div class="panel" id="challengePanel"><h2>チャレンジ</h2><div class="stat"><span>捕獲数</span><b class="challenge-score" id="score">0</b></div></div>'
          if old2 not in s: raise SystemExit('old timer panel not found')
          s=s.replace(old2,new2,1)
          marker='.challenge-timer{font-size:2.15rem!important;color:var(--red)!important;min-width:76px;text-align:center;line-height:1;letter-spacing:.03em}.challenge-timer.urgent{animation:timerPulse .55s ease-in-out infinite alternate}@keyframes timerPulse{from{transform:scale(1)}to{transform:scale(1.12)}}'
          css='.challenge-header-timer{display:inline-flex;align-items:center;justify-content:center;min-width:76px;padding:7px 12px;border-radius:999px;background:var(--red2);border:2px solid #ee9999;color:var(--red);font-size:1.35rem;font-weight:1000;line-height:1;letter-spacing:.03em}.challenge-header-timer.urgent{animation:timerPulse .55s ease-in-out infinite alternate}@keyframes timerPulse{from{transform:scale(1)}to{transform:scale(1.12)}}'
          if marker not in s: raise SystemExit('timer css not found')
          s=s.replace(marker,marker+css,1)
          old3="function renderStats(){$('attempts').textContent=stats.attempts;$('correct').textContent=stats.correct;$('rate').textContent=stats.attempts?Math.round(stats.correct/stats.attempts*100)+'%':'0%';$('score').textContent=score;$('timer').textContent=timeLeft;$('stepLabel').textContent=step===1?'1°刻み':step+'°'}"
          new3="function renderStats(){$('attempts').textContent=stats.attempts;$('correct').textContent=stats.correct;$('rate').textContent=stats.attempts?Math.round(stats.correct/stats.attempts*100)+'%':'0%';$('score').textContent=score;$('timer').textContent=timeLeft;$('timer').classList.toggle('hidden',mode!=='challenge');$('stepLabel').textContent=step===1?'1°刻み':step+'°'}"
          if old3 not in s: raise SystemExit('renderStats target not found')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/trigger-header-challenge-timer.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows
          git commit -m 'Move challenge countdown to header' || exit 0
          git push
