name: Fix protractor next problem
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix protractor progression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "else setTimeout(()=>{if(mode==='protractor')spawnProtractor()},ok?650:1000)}"
          new = "else setTimeout(()=>{spawnProtractor()},ok?650:1000)}"
          if old not in s:
              print('already fixed or pattern not found')
              raise SystemExit(0)
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix protractor: advance to next problem"
          git push
