name: Sync official navian names

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace navian display names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const NAMES=['アカーン・リーフィ','オーロラ・シェルリザード','オータム・マッシュルーム','ベリー・リーフィ','バブルフィン・フロッグ','キャンディ・コーラルスラッグ','クラウドレイン・ラビット','クローバー・マンドラゴラ','コバルトブレード・マンティス','コーラルバブル・クラブ','ダスクフェザー・オウル','フォレスト・プルー','ハッパ・リーフィ','ヒノコ・エンバーニュート','キノコ・アップルマッシュルーム','こもりん・リトルナイトバット','コロ・ゴーレム','モフ・ウルフ','ぷるん・リトルマジックスライム','ゆきまる・スノーパフ'];"
          new = "const NAMES=['どんぐりリーフ','オーロラシェルリザード','オータムキノコ','ベリーリーフ','バブルフィンカエル','キャンディコーラルナメクジ','くもあめウサギ','クローバーマンドラゴラ','コバルトブレードカマキリ','コーラルバブルクラブ','たそがれフクロウ','森ぷる','はっぱリス','ひのこイモリ','りんごキノコ','こもりんナイトバット','ころゴーレム','もふウルフ','ぷるんスライム','ゆきまるスノーパフ'];"
          if old not in s:
              raise SystemExit('expected NAMES array not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/sync-navian-names.yml
          git rm .github/workflows/sync-navian-names.yml
          git commit -m "fix: use official Japanese navian names"
          git push
