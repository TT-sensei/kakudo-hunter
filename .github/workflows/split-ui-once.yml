name: Split ANGLE HUNTER into separate files

on:
  push:
    paths:
      - '.github/workflows/trigger-tablet-answer-layout.txt'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Split current app without changing logic
        shell: python
        run: |
          from pathlib import Path
          import re

          source = Path('angle-hunter.html')
          text = source.read_text(encoding='utf-8')

          # Safety backup: preserve the exact pre-refactor file in git history/tree.
          backup = Path('legacy/angle-hunter-before-split.html')
          backup.parent.mkdir(parents=True, exist_ok=True)
          if not backup.exists():
              backup.write_text(text, encoding='utf-8')

          style_match = re.search(r'<style>(.*?)</style>', text, re.S)
          script_matches = list(re.finditer(r'<script>(.*?)</script>', text, re.S))
          if not style_match or not script_matches:
              raise SystemExit('Could not find the existing inline style/script safely.')

          css = style_match.group(1).strip() + '\n'
          js = script_matches[-1].group(1).strip() + '\n'

          css_path = Path('css/style.css')
          js_path = Path('js/app.js')
          css_path.parent.mkdir(parents=True, exist_ok=True)
          js_path.parent.mkdir(parents=True, exist_ok=True)
          css_path.write_text(css, encoding='utf-8')
          js_path.write_text(js, encoding='utf-8')

          # Keep the existing HTML structure and all element IDs/classes intact.
          html = text[:style_match.start()] + '<link rel="stylesheet" href="css/style.css">' + text[style_match.end():]
          html = html[:script_matches[-1].start()] + '<script src="js/app.js"></script>' + html[script_matches[-1].end():]
          Path('index.html').write_text(html, encoding='utf-8')

          # Preserve the old page URL while making index.html the new entry point.
          Path('angle-hunter.html').write_text('''<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<meta http-equiv="refresh" content="0; url=./index.html">\n<link rel="canonical" href="./index.html">\n<title>ANGLE HUNTER</title>\n</head>\n<body>\n<script>location.replace('./index.html' + location.search + location.hash);</script>\n</body>\n</html>\n''', encoding='utf-8')

      - name: Commit split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/style.css js/app.js angle-hunter.html legacy/angle-hunter-before-split.html
          git diff --cached --quiet || git commit -m 'Split ANGLE HUNTER UI into HTML CSS and JS'
          git push

      - name: Remove one-time workflow
        run: |
          rm .github/workflows/split-ui-once.yml
          git add .github/workflows/split-ui-once.yml
          git commit -m 'Remove one-time UI split workflow'
          git push
