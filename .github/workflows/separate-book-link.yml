name: Separate encyclopedia link
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<button class="mode book-mode" type="button">'
          new='<button class="mode book-mode" type="button" onclick="location.href=\'book.html\'">'
          if old not in s:
              print('target button not found; trying class-only fallback')
              old='class="mode book-mode"'
              new='class="mode book-mode" onclick="location.href=\'book.html\'"'
          if new not in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Link encyclopedia to standalone page"
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/separate-book-link.yml
          git add .github/workflows/separate-book-link.yml
          git diff --cached --quiet || git commit -m "Remove temporary encyclopedia workflow"
          git push || true
