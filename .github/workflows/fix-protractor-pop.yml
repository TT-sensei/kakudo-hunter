name: Fix protractor pop position
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'chore: apply tablet answer layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tablet landscape answer layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '@media (pointer: coarse) and (orientation: landscape) and (min-width: 900px) {'
          new = '@media (orientation: landscape) and (min-width: 900px) and (min-height: 600px) {'
          count = s.count(old)
          if count:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print(f'replaced {count} tablet media query condition(s)')
          else:
              raise SystemExit('target tablet media query condition not found')
          PY
      - name: Commit layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore: apply tablet answer layout'
          git push
