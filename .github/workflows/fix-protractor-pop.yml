name: Fix tablet layout media query
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Fix tablet layout and restore 15 degree buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '@media (pointer: coarse) and (orientation: landscape) and (min-width: 900px) {'
          new = '@media (orientation: landscape) and (min-width: 900px) and (min-height: 600px) {'
          count = s.count(old)
          if count:
              s = s.replace(old, new)
              print(f'replaced {count} tablet media query condition(s)')

          pattern = r"if\(step===15\)\{.*?box\.appendChild\(s\);return\}"
          replacement = "if(step===15){for(let d=0;d<360;d+=15){const b=document.createElement('button');b.type='button';b.className='angle';b.textContent=d+'°';const choose=ev=>{ev.preventDefault();answer(d,b)};b.addEventListener('pointerup',choose);box.appendChild(b)}return}"
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('15-degree select branch not found')
          s = s2
          p.write_text(s, encoding='utf-8')
          print('restored 15-degree mode to card buttons')
          PY
      - name: Commit to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore 15 degree answer cards'
          git push
