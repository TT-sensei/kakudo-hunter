name: Fix tablet layout and 15 degree cards
on:
  pull_request_target:
    types: [opened, synchronize]
  push:
    branches:
      - 'fix/15-degree-answer-cards'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '@media (pointer: coarse) and (orientation: landscape) and (min-width: 900px) {'
          new = '@media (orientation: landscape) and (min-width: 900px) and (min-height: 600px) {'
          if old in s:
              s = s.replace(old, new)
          pattern = r"if\(step===15\)\{.*?box\.appendChild\(s\);return\}"
          replacement = "if(step===15){for(let d=0;d<360;d+=15){const b=document.createElement('button');b.type='button';b.className='angle';b.textContent=d+'°';const choose=ev=>{ev.preventDefault();answer(d,b)};b.addEventListener('pointerup',choose);box.appendChild(b)}return}"
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n == 1:
              s = s2
          p.write_text(s, encoding='utf-8')
          print('15-degree card fix applied' if n == 1 else '15-degree branch already fixed')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore 15 degree answer cards'
          git push
