name: Tablet two-pane answer layout

on:
  push:
    paths:
      - '.github/workflows/trigger-tablet-answer-layout.txt'

permissions:
  contents: write

jobs:
  apply-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply tablet layout CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
          /* Tablet landscape: keep the problem large and move answer controls to the right. */
          @media (pointer: coarse) and (orientation: landscape) and (min-width: 900px) {
            .game {
              grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
              grid-template-rows: minmax(0, 1fr) auto auto;
              gap: 10px 18px;
            }
            .arena-wrap {
              grid-column: 1;
              grid-row: 1 / span 3;
              min-width: 0;
              min-height: 0;
              padding: 18px;
            }
            .arena {
              width: min(76vh, calc(100vw - 420px), 680px);
              height: min(76vh, calc(100vw - 420px), 680px);
              min-width: 400px;
              min-height: 400px;
            }
            .side {
              grid-column: 2;
              grid-row: 1;
              align-self: start;
            }
            #angles {
              grid-column: 2;
              grid-row: 2;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 10px;
              align-self: center;
            }
            .angle {
              min-height: 64px;
              font-size: 1.08rem;
            }
            #next,
            #protractorNext {
              grid-column: 2;
              grid-row: 3;
              justify-self: stretch;
              width: 100%;
              min-height: 54px;
            }
            #protractorView {
              grid-column: 1;
              grid-row: 1 / span 3;
              min-width: 0;
              min-height: 0;
              padding: 10px 18px;
            }
            .protractor-card {
              width: min(96%, 860px);
            }
            .protractor-question {
              grid-column: 2;
              grid-row: 2;
              align-self: center;
              justify-self: stretch;
              flex-wrap: nowrap;
              padding: 10px;
              background: #fff;
              border: 1px solid var(--line);
              border-radius: 16px;
              box-shadow: 0 4px 14px rgba(24,42,67,.06);
            }
            .degree-input {
              width: 120px;
              height: 58px;
              font-size: 1.65rem;
            }
            .degree-submit {
              min-height: 58px;
              padding: 10px 22px;
            }
            .protractor-help {
              grid-column: 2;
              grid-row: 2;
              align-self: end;
              justify-self: center;
              transform: translateY(58px);
            }
          }
          '''
          marker = '</style>'
          pos = s.rfind(marker)
          if pos == -1:
              raise SystemExit('closing style tag not found')
          if 'Tablet landscape: keep the problem large and move answer controls to the right.' in s:
              raise SystemExit('tablet layout already applied')
          s = s[:pos] + css + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/trigger-tablet-answer-layout.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Optimize tablet landscape answer layout'
          git push
