name: Recover correct ANGLE HUNTER entry and split files

on:
  push:
    paths:
      - '.github/workflows/trigger-tablet-answer-layout.txt'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore pre-refactor entry and split it safely
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          import re

          # The commit immediately before our split attempt is the known-good tree.
          good = 'f9942b401c43aa1e2cc680c513e126894b1e5415'
          subprocess.run(['git', 'checkout', good, '--', 'index.html', 'angle-hunter.html'], check=True)

          text = Path('index.html').read_text(encoding='utf-8')
          styles = re.findall(r'<style(?:\s+[^>]*)?>(.*?)</style>', text, re.S)
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          if not styles or not scripts:
              raise SystemExit('Expected inline CSS/JS was not found in the known-good index.html.')

          Path('css').mkdir(exist_ok=True)
          Path('js').mkdir(exist_ok=True)
          Path('css/style.css').write_text('\n\n'.join(s.strip() for s in styles) + '\n', encoding='utf-8')
          Path('js/app.js').write_text('\n\n'.join(s.strip() for s in scripts) + '\n', encoding='utf-8')

          # Remove only the inline CSS and inline JS. Keep HTML structure, IDs, assets and logic intact.
          html = re.sub(r'<style(?:\s+[^>]*)?>.*?</style>', '', text, flags=re.S)
          html = re.sub(r'<script>.*?</script>', '', html, flags=re.S)
          html = html.replace('</head>', '  <link rel="stylesheet" href="css/style.css">\n</head>', 1)
          html = html.replace('</body>', '  <script src="js/app.js"></script>\n</body>', 1)
          Path('index.html').write_text(html, encoding='utf-8')

          # Remove temporary artifacts created by the failed first attempt.
          legacy = Path('legacy/angle-hunter-before-split.html')
          if legacy.exists():
              legacy.unlink()

      - name: Commit recovered split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html angle-hunter.html css/style.css js/app.js legacy
          git diff --cached --quiet || git commit -m 'Recover correct app and split HTML CSS JS'
          git push

      - name: Remove temporary recovery workflow
        run: |
          rm .github/workflows/recover-and-split-correct-app.yml
          git add .github/workflows/recover-and-split-correct-app.yml
          git commit -m 'Remove temporary recovery workflow'
          git push
