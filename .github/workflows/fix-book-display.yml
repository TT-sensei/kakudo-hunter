name: Fix book display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch encyclopedia rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</script>'
          patch="""
// Encyclopedia fallback: render independently of the game state.
function renderBook(){
  const grid=document.getElementById('bookGrid');
  if(!grid)return;
  grid.innerHTML='';
  NAVIANS.forEach((file,i)=>{
    const card=document.createElement('div');
    card.className='book-card';
    const img=document.createElement('img');
    img.src=NAV+file;
    img.alt=NAMES[i]||'ナビアン';
    img.loading='lazy';
    const name=document.createElement('span');
    name.textContent=NAMES[i]||'ナビアン';
    card.appendChild(img);
    card.appendChild(name);
    grid.appendChild(card);
  });
}
const bookModeButton=document.querySelector('.book-mode');
if(bookModeButton)bookModeButton.addEventListener('click',()=>{
  document.getElementById('start').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  const book=document.getElementById('book');
  book.classList.remove('hidden');
  renderBook();
});
const bookBackButton=document.getElementById('bookBack');
if(bookBackButton)bookBackButton.addEventListener('click',()=>{
  document.getElementById('book').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
});
"""
          if 'function renderBook(){' not in s:
              s=s.replace(marker,patch+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: render encyclopedia independently" || true
          git rm .github/workflows/fix-book-display.yml
          git commit -m "chore: remove temporary book workflow"
          git push
