name: Patch Navian collection tracking

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collection tracking
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="let mode='hunter',step=30,target=0,pos=0,anim=null,locked=false,timerId=null,timeLeft=60,score=0,stats=loadStats(),protractorVisualTarget=0;"
          if old in s and 'currentNavian=' not in s:
              s=s.replace(old,"let mode='hunter',step=30,target=0,pos=0,anim=null,locked=false,timerId=null,timeLeft=60,score=0,stats=loadStats(),protractorVisualTarget=0,currentNavian='';",1)
          old="function randomNav(){return NAVIANS[Math.floor(Math.random()*NAVIANS.length)]}"
          if old in s:
              s=s.replace(old,"function randomNav(){currentNavian=NAVIANS[Math.floor(Math.random()*NAVIANS.length)];return currentNavian}",1)
          marker="function saveStats(){localStorage.setItem('angleHunter.stats.v2',JSON.stringify(stats))}"
          if 'function recordNavianGet()' not in s:
              if marker not in s: raise SystemExit('saveStats marker not found')
              helper="function saveStats(){localStorage.setItem('angleHunter.stats.v2',JSON.stringify(stats))}function recordNavianGet(){if(!currentNavian)return;try{const key='angleHunter.navianGets.v1';const gets=JSON.parse(localStorage.getItem(key))||{};gets[currentNavian]=(Number(gets[currentNavian])||0)+1;localStorage.setItem(key,JSON.stringify(gets))}catch(e){}}"
              s=s.replace(marker,helper,1)
          old="if(ok){stats.correct++;score++;button.classList.add('correct');"
          if old in s and 'recordNavianGet();button.classList.add' not in s:
              s=s.replace(old,"if(ok){stats.correct++;score++;recordNavianGet();button.classList.add('correct');",1)
          old="if(ok){stats.correct++;score++;input.classList.add('protractor-correct');"
          if old in s and 'recordNavianGet();input.classList.add' not in s:
              s=s.replace(old,"if(ok){stats.correct++;score++;recordNavianGet();input.classList.add('protractor-correct');",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: track Navian captures" || true
          git rm .github/workflows/fix-book-display.yml || true
          git commit -m "chore: remove temporary collection workflow" || true
          git push
