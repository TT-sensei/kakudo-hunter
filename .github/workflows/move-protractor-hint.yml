name: Move protractor hint
on:
  push:
    paths:
      - '.github/workflows/move-protractor-hint.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move-hint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move hint outside protractor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Pull the existing left/right reading hints out of the protractor markup,
          # preserving their classes so the existing JS continues to update them.
          hints = re.findall(r'<div class="protractor-direction\s+(?:left|right)">.*?</div>', s, flags=re.S)
          if len(hints) != 2:
              raise SystemExit(f'Expected 2 protractor-direction hints, found {len(hints)}')
          s = re.sub(r'<div class="protractor-direction\s+(?:left|right)">.*?</div>', '', s, flags=re.S)

          # Put the hints directly above the answer-entry area.
          marker = '<div class="protractor-question">'
          if marker not in s:
              raise SystemExit('protractor-question marker not found')
          hint_block = '<div class="protractor-hints">' + ''.join(hints) + '</div>'
          s = s.replace(marker, hint_block + marker, 1)

          # The hint is no longer part of the drawing area; keep it compact and centered.
          s = s.replace('.protractor-direction{position:absolute;bottom:5%;font-size:.7rem;color:var(--muted);font-weight:800;z-index:8}.protractor-direction.left{left:7%}.protractor-direction.right{right:7%}', '.protractor-hints{grid-column:1;display:flex;align-items:center;justify-content:center;gap:18px;min-height:28px}.protractor-direction{position:static;font-size:.78rem;color:var(--muted);font-weight:800;z-index:8}')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: move protractor reading hint below question'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/move-protractor-hint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/move-protractor-hint.yml
          git diff --cached --quiet || git commit -m 'chore: remove temporary protractor hint workflow'
          git push || true
