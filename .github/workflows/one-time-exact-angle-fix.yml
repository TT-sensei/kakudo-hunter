name: one-time exact angle fix
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact answer check
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const ok=Math.abs(value-target)<=1'
          new='const ok=value===target'
          if old not in s:
              raise SystemExit('protractor tolerance check not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify exact check
        run: |
          grep -q "const ok=value===target" index.html
          ! grep -q "Math.abs(value-target)<=1" index.html
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-exact-angle-fix.yml
          git commit -m 'fix protractor answer validation to exact angle'
          git push
