name: one-time protractor tolerance
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore visual tolerance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const ok=value===target','const ok=Math.abs(value-target)<=1',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q "const ok=Math.abs(value-target)<=1" index.html
          grep -q "const ok=choice===target" index.html
          grep -q "if(mode==='challenge'){setTimeout" index.html
          grep -q "\$('next').style.display='inline-flex'" index.html
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-protractor-tolerance.yml
          git commit -m 'fix protractor answer tolerance for line thickness'
          git rm .github/workflows/one-time-protractor-tolerance.yml
          git commit -m 'chore remove one-time tolerance workflow'
          git push
